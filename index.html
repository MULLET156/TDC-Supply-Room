<!doctype html>
<html lang="en">
<head>

<title>TDC Supply Room</title>
<style>:root{color-scheme:light;box-sizing:border-box}body{margin:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Orbitron:wght@600;800&family=Monoton&family=Bungee&display=swap">
<style>
/* Layout: one-column operations list, sticky search header, fixed bottom action bar for phone use in the supply room */
:root{
  --bg:#f3f6f6; --surface:#ffffff; --sunk:#e8eeee; --line:#d5dfdf;
  --fg:#14201f; --muted:#5b6b6a;
  --accent:#0b6e69; --accent-fg:#ffffff; --accent-soft:#d6ecea;
  --warn:#a35a00; --warn-soft:#fbead2; --bad:#b3261e; --bad-soft:#f9dedb; --info:#2b4fbf; --info-soft:#dfe6fb; --ok:#2d7a3a;
  --red:#c62828; --red-fg:#ffffff; --red-soft:#fde3e1; --yel:#f2c12e; --yel-fg:#3b2c00; --yel-soft:#fff4cc; --yel-ink:#7a5a00;
  --f-ui:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1716; --surface:#16211f; --sunk:#1d2a28; --line:#2a3a38; --red:#e5534b; --red-fg:#ffffff; --red-soft:#3d1c19; --yel:#f2c12e; --yel-fg:#2a1f00; --yel-soft:#3a3010; --yel-ink:#f2c12e;
  --fg:#e3eceb; --muted:#93a5a3; --accent:#4fc2b9; --accent-fg:#06201e; --accent-soft:#183634;
  --warn:#f0a94a; --warn-soft:#3a2a12; --bad:#f2847b; --bad-soft:#3d1c19; --info:#93abff; --info-soft:#1d2645; --ok:#7fd08b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1716; --surface:#16211f; --sunk:#1d2a28; --line:#2a3a38; --red:#e5534b; --red-fg:#ffffff; --red-soft:#3d1c19; --yel:#f2c12e; --yel-fg:#2a1f00; --yel-soft:#3a3010; --yel-ink:#f2c12e;
  --fg:#e3eceb; --muted:#93a5a3; --accent:#4fc2b9; --accent-fg:#06201e; --accent-soft:#183634;
  --warn:#f0a94a; --warn-soft:#3a2a12; --bad:#f2847b; --bad-soft:#3d1c19; --info:#93abff; --info-soft:#1d2645; --ok:#7fd08b; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:15px;line-height:1.4;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header .wrap{padding-block:12px 10px;display:grid;gap:10px}
.top{display:flex;align-items:center;gap:12px}
.brand{display:flex;flex-direction:column;min-width:0;flex:1 1 260px}
.brand b{font-size:18px;font-weight:700;letter-spacing:-.01em}
.brand span{font-size:12px;color:var(--muted)}
.brand .date{font-family:var(--f-mono);font-size:13px;color:var(--muted);margin-top:2px}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--ok)}.dot.busy{background:var(--warn)}.dot.err{background:var(--bad)}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;font-size:13px}
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tabbreak{flex-basis:100%;height:0;margin-top:-8px}
@media (max-height:900px){header{position:static}}
.top > *{order:3}
.top > .brand{order:1}
.top > .tabs-main{order:2}
.tabs-main{flex:1 1 100%;display:grid;grid-template-columns:repeat(3,minmax(0,230px));gap:10px}
.tab.t-exp{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.tab.t-exp .n{color:var(--warn)}
.tab.t-exp[aria-selected="true"]{background:var(--warn);border-color:var(--warn);color:var(--surface)}
.tab.t-exp[aria-selected="true"] .n{color:var(--surface);opacity:1}
@media (max-width:520px){.tab.big{font-size:15.5px;padding:8px 6px;gap:5px;min-height:54px}.tab.big .n{font-size:14px}.tabs-main{gap:6px}}
.tab.big{justify-content:center;min-height:58px;font-size:19px;font-weight:800;border-width:2px;border-radius:14px}
.tab.big .n{font-size:17px;font-weight:700}
@media (max-width:520px){.tab.big{font-size:16px;padding:8px 4px;gap:4px;min-height:54px}.tab.big .n{font-size:14.5px}}
@media (max-width:390px){.tab.big{font-size:14.5px;letter-spacing:-.01em}.tab.big .n{font-size:13.5px}}
.tab.t-need{background:var(--red-soft);border-color:var(--red);color:var(--red)}
.tab.t-need .n{color:var(--red)}
.tab.t-need[aria-selected="true"]{background:var(--red);border-color:var(--red);color:var(--red-fg)}
.tab.t-need[aria-selected="true"] .n{color:var(--red-fg);opacity:1}
/* On order: purple, so it doesn't look like the yellow "at reserve" color */
:root{--ordc:#6a3fc4;--ordc-soft:#efe8fc;--ordc-fg:#ffffff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ordc:#b69cff;--ordc-soft:#2b2145;--ordc-fg:#1a1030}}
:root[data-theme="dark"]{--ordc:#b69cff;--ordc-soft:#2b2145;--ordc-fg:#1a1030}
.tab.t-ord{background:var(--ordc-soft);border-color:var(--ordc);color:var(--ordc)}
.tab.t-ord .n{color:var(--ordc)}
.tab.t-ord[aria-selected="true"]{background:var(--ordc);border-color:var(--ordc);color:var(--ordc-fg)}
.tab.t-ord[aria-selected="true"] .n{color:var(--ordc-fg);opacity:1}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:10px 18px;min-height:44px;font-size:15.5px;font-weight:700;white-space:nowrap;display:flex;gap:8px;align-items:center}
.tab:hover{border-color:var(--accent)}
.tab .n{font-family:var(--f-mono);font-size:14px;font-weight:600;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.tab[aria-selected="true"] .n{color:var(--accent-fg);opacity:.85}
@media (max-width:520px){.tab{padding:9px 15px;font-size:15px}}
.filters{display:grid;grid-template-columns:1fr auto auto auto;gap:6px}
.filters input,.filters select{border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:8px 10px;min-width:0}
.filters select{max-width:150px}
@media (max-width:520px){.filters{grid-template-columns:1fr 1fr}.filters input{grid-column:1/-1}.filters select{max-width:none}}
main .wrap{padding-block:14px 24px;display:grid;gap:14px}
.notice{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px 16px;display:grid;gap:6px}
.notice.err{border-color:var(--bad);background:var(--bad-soft)}
.notice b{font-weight:700}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.grp{padding:10px 14px 6px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--sunk);border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}
.grp:first-child{border-top:0}
.grp span{text-transform:none;letter-spacing:0;font-weight:500}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.grp+.row,.list>.row:first-child{border-top:0}
.row .chk{width:20px;height:20px;accent-color:var(--accent)}
.row .chk[hidden]+.info{grid-column:1/3}
.info{min-width:0;cursor:pointer}
.info .nm{font-weight:600;overflow-wrap:anywhere}
.info .meta{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:2px}
.pill{display:inline-block;font-size:11.5px;font-weight:700;padding:1px 7px;border-radius:999px;margin-right:4px;vertical-align:1px}
.p-need{background:var(--warn-soft);color:var(--warn)}.p-ord{background:var(--info-soft);color:var(--info)}.p-exp{background:var(--bad-soft);color:var(--bad)}.pill.p-after{margin:0 0 0 2px}.p-sku{background:var(--sunk);color:var(--muted);font-family:var(--f-mono);font-weight:400}
.step{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--sunk)}
.step button{border:0;background:transparent;width:34px;height:36px;font-size:18px;font-weight:600}
.step button:active{background:var(--line)}
.step .q{min-width:52px;text-align:center;font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:14px;padding:0 2px}
.step .q small{color:var(--muted)}
.step.saving{border-color:var(--warn)}.step.saved{border-color:var(--ok)}
.ordbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.ordbar p{margin:0;color:var(--muted);font-size:13px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;font-weight:600}
a.btn{text-decoration:none;color:inherit;display:inline-flex;align-items:center;justify-content:center}
.filebtn{position:relative;overflow:hidden;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.filebtn input[type=file]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:100px}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.dock .wrap{padding-block:10px;display:grid;grid-template-columns:2fr 1fr;gap:8px}
.dock .btn{padding:12px;font-size:15px}
/* sheet panel */
.scrim{position:fixed;inset:0;background:rgba(5,15,14,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.panel{background:var(--surface);width:100%;max-width:620px;max-height:92%;overflow:auto;border-radius:16px 16px 0 0;padding:18px max(16px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));display:grid;gap:14px}
@media (min-width:700px){.scrim{align-items:center}.panel{border-radius:16px;max-height:88%}}
.ph{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.ph h2{margin:0;font-size:18px;line-height:1.25;text-wrap:balance;overflow-wrap:anywhere}
.ph .sub{font-size:12px;color:var(--muted);font-family:var(--f-mono)}
.counts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cbox{border:1px solid var(--line);border-radius:var(--r);padding:10px;display:grid;gap:6px;justify-items:center}
.cbox label{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.cbox .step{width:100%;justify-content:space-between}
.cbox .step input{width:70px;border:0;background:transparent;text-align:center;font-family:var(--f-mono);font-size:20px;font-weight:600}
.cbox .step button{width:48px;height:46px;font-size:22px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fields .full{grid-column:1/-1}
.f{display:grid;gap:4px;min-width:0}
.f label{font-size:12px;font-weight:600;color:var(--muted)}
.f input,.f select,.f textarea{border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:9px 10px;width:100%;min-width:0}
.f input.mono{font-family:var(--f-mono)}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.actions .grow{flex:1}
.hint{font-size:12.5px;color:var(--muted);margin:0}
.ordinfo{border-radius:var(--r);padding:10px 12px;background:var(--info-soft);color:var(--info);font-size:13.5px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.ordinfo.need{background:var(--warn-soft);color:var(--warn)}
.shot{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:start}
.shot img{width:96px;height:96px;object-fit:cover;border-radius:8px;border:1px solid var(--line);background:var(--sunk)}
.status{font-size:13.5px;color:var(--muted)}
.status.err{color:var(--bad)}
.match{border:1px solid var(--accent);background:var(--accent-soft);border-radius:var(--r);padding:12px;display:grid;gap:8px}
.match .nm{font-weight:700}
.drop{border:2px dashed var(--line);border-radius:var(--r);padding:22px;text-align:center;display:grid;gap:10px;justify-items:center}
.drop .big{font-size:16px;font-weight:600}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:8px;font-size:13.5px;z-index:30;max-width:90%}
@media (prefers-reduced-motion:no-preference){.panel{animation:up .18s ease-out}@keyframes up{from{transform:translateY(16px);opacity:.6}}}
</style>
<style>
.hist{display:grid;gap:0}
.hrow{padding:10px 14px;border-top:1px solid var(--line);display:grid;gap:3px}
.hrow:first-child{border-top:0}
.hrow b{font-weight:600}
.hrow .hint{font-size:12.5px}
.logtools{display:grid;gap:10px}
/* iPhone Safari zooms into any field with text under 16px: keep fields at 16px on phones */
@media (max-width:640px){input:not([type=checkbox]):not([type=radio]),select,textarea{font-size:16px!important}}
.setrow select#oldAge{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:4px 6px;font:inherit;width:auto;display:inline-block}
.setrow.dangerrow{background:var(--bad-soft)}
.logfilt{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.logfilt label{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--muted)}
.logfilt select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;font:inherit;font-size:14.5px;color:var(--fg);max-width:260px}
.logfilt #logExport{margin-left:auto}
@media (max-width:520px){.logfilt label{flex:1 1 100%}.logfilt select{flex:1;max-width:none}.logfilt #logExport{margin-left:0;flex:1}}
.hord{border-top:1px solid var(--line)}
.hord:first-child{border-top:0}
.hord summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:1fr auto;grid-template-areas:"sup cnt" "when cnt";align-items:center;gap:2px 12px;padding:12px 44px 12px 16px;position:relative;min-height:56px}
.hord summary::-webkit-details-marker{display:none}
.hord summary::after{content:"▾";position:absolute;right:16px;top:50%;transform:translateY(-50%);font-size:18px;color:var(--muted);transition:transform .15s}
.hord[open] summary::after{transform:translateY(-50%) rotate(180deg)}
.hord summary:hover{background:var(--sunk)}
.hord .hsup{grid-area:sup;font-size:18px;font-weight:800;line-height:1.2}
.hord .hwhen{grid-area:when;font-family:var(--f-mono);font-size:13.5px;color:var(--muted)}
.hord .hcnt{grid-area:cnt;font-size:14px;font-weight:600;color:var(--muted);white-space:nowrap}
.hord[open] summary{background:var(--sunk)}
.hlines{list-style:none;margin:0;padding:4px 16px 12px}
.hlines li{display:flex;gap:14px;align-items:baseline;padding:10px 0;border-bottom:1px dashed var(--line);font-size:17px;line-height:1.3}
.hlines li:last-child{border-bottom:0}
.hlines .hq{flex:none;min-width:2.6em;text-align:right;font-family:var(--f-mono);font-weight:800;font-size:18px;color:var(--accent)}
.hlines .hq::after{content:" ×";font-weight:400;color:var(--muted);font-size:15px}
.hlines .hn{flex:1;min-width:0;font-weight:600;overflow-wrap:anywhere}
.hlines .hn small{display:block;font-size:13.5px;font-weight:400;color:var(--muted)}
.hlines .hs{flex:none;font-size:12.5px;color:var(--muted)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.danger.armed{background:var(--bad);color:var(--surface)}
.lastby{font-size:12px;color:var(--muted)}
.top{flex-wrap:wrap}
.whoami{display:flex;align-items:center;gap:8px;background:var(--sunk);border:1px solid var(--line);border-radius:999px;padding:3px 4px 3px 12px}
.whoami label{font-size:12.5px;color:var(--muted);white-space:nowrap}
.whoami select{border:0;background:var(--accent-soft);color:var(--fg);border-radius:999px;padding:6px 10px;font-family:var(--f-mono);font-weight:600}
.whoami.missing{border-color:var(--warn);background:var(--warn-soft)}
.init{font-family:var(--f-mono);font-weight:600;font-size:12px;background:var(--accent-soft);color:var(--fg);border-radius:5px;padding:2px 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:2px;font-family:var(--f-mono);font-weight:600;background:var(--accent-soft);border-radius:6px;padding:3px 3px 3px 9px}
.chip button{border:0;background:transparent;width:30px;height:30px;font-size:16px;border-radius:4px;color:var(--muted)}
.chip button:hover{background:var(--surface);color:var(--bad)}
.arow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start;padding:10px 14px;border-top:1px solid var(--line)}
.arow:first-child{border-top:0}
.arow .t{font-weight:600;overflow-wrap:anywhere}
.arow .d{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.arow time{font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap}
.daywrap h3{margin:0 0 6px;font-family:var(--f-mono);font-weight:400;font-size:12.5px;color:var(--muted)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.toolbar p{margin:0;color:var(--muted);font-size:13px}
.setrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 12px;border-top:1px solid var(--line)}
.setrow:first-child{border-top:0}
.setrow.two{grid-template-columns:minmax(0,1fr) auto}
.setrow input{border:1px solid var(--line);background:var(--sunk);border-radius:7px;padding:7px 9px;min-width:0;width:100%}
.setrow .cnt{font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap;text-align:right}
.sechead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px;margin-top:4px}
.sechead h2{margin:0;font-size:17px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--fg)}
.sechead > .hint{font-size:13px}
.sechead{margin-top:10px;padding-bottom:4px;border-bottom:2px solid var(--accent-soft)}
.secnote{margin:0;font-size:13px;color:var(--muted)}
.addline{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;padding:12px;border-top:1px solid var(--line);background:var(--sunk)}
.addline input{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:7px 9px}
.listpad{padding:12px}
.setrow.sup{grid-template-columns:auto minmax(0,1fr) minmax(0,1fr) auto auto}
.grip{border:1px solid transparent;background:transparent;border-radius:6px;width:36px;height:40px;font-size:20px;line-height:1;color:var(--muted);cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.grip:hover,.grip:focus-visible{border-color:var(--line);background:var(--sunk);color:var(--accent)}
.setrow.dragging{position:relative;z-index:2;background:var(--accent-soft);box-shadow:0 6px 18px rgba(0,0,0,.18);border-radius:8px}
.setrow.dragging .grip{cursor:grabbing;color:var(--accent)}

<script>
/* ---------- hosted runtime: the page talks to api.php and signs in with the office password ---------- */
var HOSTED = true;
window.TDC = (function(){
  const API = "api.php";
  let lastRev = -1, pollRev = -1, signedOutHook = null, pollT = null, refreshT = null, busy = false, status = null, ready = null;
  const listeners = new Set();
  const E = (code, message) => ({ code, message });
  /* Shared hosting allows only a few database connections at once, so a "busy" answer is retried.
     "add" is only retried when the server never reached the database. */
  async function call(op, payload){
    for (let attempt = 0; ; attempt++) {
      try { return await call1(op, payload); }
      catch(e) {
        const again = e.code === "db_busy" || e.code === "db_connect" || (e.code === "unavailable" && !["add", "login", "ai", "readlink", "blob_put", "pricesearch"].includes(op));
        if (!again || attempt >= 3) throw e.code === "db_busy" || e.code === "db_connect" ? E("unavailable", "The server was busy and couldn't save. Try again in a moment.") : e;
        await new Promise(r => setTimeout(r, 400 * (attempt + 1) + Math.random() * 300));
      }
    }
  }
  async function call1(op, payload){
    let r, j;
    try { r = await fetch(API, { method: "POST", credentials: "same-origin", cache: "no-store", headers: { "Content-Type": "application/json", "X-TDC": "1" }, body: JSON.stringify({ op, ...(payload || {}) }) }); }
    catch(e) { throw E("unavailable", "No connection to the server."); }
    try { j = await r.json(); } catch(e) { throw E("unavailable", "The server sent an unexpected reply."); }
    if (!j || !j.ok) {
      const err = (j && j.error) || "unavailable";
      if (err === "signed_out" && signedOutHook) signedOutHook();
      throw E(err === "too_large" ? "invalid_argument" : err, (j && j.message) || "Something went wrong.");
    }
    if (typeof j.rev === "number" && j.rev > lastRev) lastRev = j.rev;
    return j;
  }
  const meta = { fromCache: false, hasPendingWrites: false };
  const docSnap = (id, exists, data) => ({ id, exists, data: () => exists ? data : undefined, metadata: meta });
  const qSnap = docs => ({ docs, size: docs.length, empty: !docs.length, docChanges: () => [], metadata: meta });
  function split(path){ const p = String(path).split("/"); if (p.length !== 2) throw new TypeError("Document paths look like collection/id"); return p; }

  function readOf(L){ return L.kind === "doc" ? { kind: "get", col: L.col, id: L.id } : { kind: "query", col: L.col, where: L.q.where, orderBy: L.q.orderBy, limit: L.q.limit }; }
  function deliver(L, res){ if (!listeners.has(L)) return; if (L.kind === "doc") L.next(docSnap(L.id, res.exists, res.data || {})); else L.next(qSnap(res.docs.map(d => docSnap(d.id, true, d.data)))); }
  function refreshAll(){
    if (busy) return refreshSoon(); busy = true;
    const Ls = [...listeners];
    return call("multi", { reads: Ls.map(readOf) }).then(j => { pollRev = j.rev; Ls.forEach((L, i) => deliver(L, j.results[i])); },
      e => { for (const L of Ls) if (listeners.has(L) && L.err) L.err(e); }).finally(() => { busy = false; });
  }
  function refreshSoon(){ clearTimeout(refreshT); refreshT = setTimeout(refreshAll, 60); }
  async function poll(){ try { const j = await call("rev"); if (j.rev !== undefined && j.rev !== pollRev) await refreshAll(); } catch(e) {} }
  function schedule(){ clearTimeout(pollT); pollT = setTimeout(async () => { await poll(); schedule(); }, document.visibilityState === "visible" ? 5000 : 30000); }
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") { poll(); schedule(); } });
  addEventListener("online", () => poll());

  async function write(op, payload){ const j = await call(op, payload); refreshSoon(); return j; }
  function docRef(col, id){
    return { id, path: col + "/" + id,
      get: () => call("get", { col, id }).then(j => docSnap(id, j.exists, j.data || {})),
      set: d => write("set", { col, id, data: d }).then(() => {}),
      update: d => write("update", { col, id, data: d }).then(() => {}),
      delete: () => write("delete", { col, id }).then(() => {}),
      onSnapshot(next, err){ const L = { kind: "doc", col, id, next, err }; listeners.add(L); refreshSoon(); return () => listeners.delete(L); } };
  }
  function query(col, q){
    return { path: col,
      where: (f, op, v) => query(col, { ...q, where: [...q.where, [f, op, v]] }),
      orderBy: (f, dir) => query(col, { ...q, orderBy: [f, dir || "asc"] }),
      limit: n => query(col, { ...q, limit: n }),
      get: () => call("query", { col, where: q.where, orderBy: q.orderBy, limit: q.limit }).then(j => qSnap(j.docs.map(d => docSnap(d.id, true, d.data)))),
      onSnapshot(next, err){ const L = { kind: "query", col, q, next, err }; listeners.add(L); refreshSoon(); return () => listeners.delete(L); },
      doc: id => docRef(col, id),
      add: d => write("add", { col, data: d }).then(j => docRef(col, j.id)) };
  }
  const db = { collection: c => query(c, { where: [], orderBy: null, limit: 2000 }), doc: p => { const [c, id] = split(p); return docRef(c, id); } };

  const downloads = { async save({ filename, data }){
    const blob = data instanceof Blob ? data : new Blob([data], { type: /\.json$/i.test(filename) ? "application/json" : /\.csv$/i.test(filename) ? "text/csv" : "application/octet-stream" });
    const url = URL.createObjectURL(blob), a = document.createElement("a"); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000); return { status: "saved" }; } };

  const b64 = blob => new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(",")[1] || ""); fr.onerror = () => rej(E("invalid_argument", "That picture couldn't be read.")); fr.readAsDataURL(blob); });
  const unb64 = (data, type) => { const bin = atob(data), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return new Blob([u], { type: type || "image/jpeg" }); };
  const assets = {
    async upload(blob, opt){ const j = await call("blob_put", { data: await b64(blob), type: (opt && opt.type) || blob.type || "" }); return { id: j.id, url: "blob.php?id=" + j.id }; },
    async delete(id){ if (/^[a-f0-9]{32}$/.test(String(id || ""))) await call("blob_delete", { id }); }
  };
  /* Claude through the server's Anthropic API key: same calls the page made inside Claude */
  const sample = {
    async json(prompt, opt){
      const images = [];
      for (const im of (opt && opt.images) || []) { if (im instanceof Blob) images.push({ type: im.type || "image/png", data: await b64(im) }); else if (im && im.data) images.push({ type: im.mimeType || im.type || "image/png", data: im.data }); }
      const j = await call("ai", { prompt, images, tier: opt && opt.modelTier === "quick" ? "quick" : "" });
      return j.value;
    },
    async limits(){ return { images: { maxCount: 4 } }; }
  };
  const user = { id: async () => "office", can: async () => true };

  /* ---------- sign-in screen ---------- */
  function gate(){
    const el = document.getElementById("signin"), form = document.getElementById("signinForm"), pw = document.getElementById("signinPw"), msg = document.getElementById("signinMsg"), btn = form.querySelector("button");
    const logo = document.querySelector("header .logo"); if (logo && !el.querySelector(".logo")) el.querySelector(".sg-brand").prepend(logo.cloneNode(true));
    return new Promise(resolve => {
      el.hidden = false; setTimeout(() => pw.focus(), 50);
      form.onsubmit = async ev => { ev.preventDefault(); msg.textContent = ""; btn.disabled = true; btn.textContent = "Signing in…";
        try { await call("login", { password: pw.value }); pw.value = ""; el.hidden = true; resolve(); }
        catch(e) { msg.textContent = e.message || "Couldn't sign in. Try again."; pw.select(); }
        finally { btn.disabled = false; btn.textContent = "Sign in"; } };
    });
  }
  async function signIn(){
    for (;;) {
      try { status = await call("status"); break; }
      catch(e) {
        const el = document.getElementById("signin"); el.hidden = false;
        document.getElementById("signinMsg").textContent = e.code === "not_configured" || e.code === "db_connect" || e.code === "db_schema" ? e.message : "Can't reach the server. Retrying…";
        document.getElementById("signinForm").hidden = true;
        await new Promise(r => setTimeout(r, 5000));
      }
    }
    document.getElementById("signinForm").hidden = false; document.getElementById("signinMsg").textContent = "";
    if (!status.signedIn) await gate();
    signedOutHook = (function hook(){ return async () => { signedOutHook = null; await gate(); signedOutHook = hook(); refreshAll(); }; })();
    schedule();
  }
  async function use(name){
    if (!ready) ready = signIn();
    await ready;
    return { db, downloads, assets, user, sample: status && status.ai ? sample : null, mcp: null }[name] || null;
  }
  async function readLink(url, ctx){
    const j = await call("readlink", { url, ctx: ctx || {} });
    return { ...j, photo: j.photo && j.photo.data ? unb64(j.photo.data, j.photo.type) : null };
  }
  async function findProduct(q, ctx){
    const j = await call("findproduct", { q, ctx: ctx || {} });
    return { ...j, photo: j.photo && j.photo.data ? unb64(j.photo.data, j.photo.type) : null };
  }
  async function fetchPhoto(url, page){ const j = await call("fetchphoto", { url, page: page || "" }); return unb64(j.photo.data, j.photo.type); }
  async function fetchLogo(site){ const j = await call("fetchlogo", { site }); return (j.logos || []).map(l => ({ ...l, blob: unb64(l.data, l.type) })); }
  async function readDoc(files, ctx){ return call("readdoc", { files, ctx: ctx || {} }); }
  async function usage(){ return call("usage", {}); }
  async function mpnSearch(mpn, host, skip){ const j = await call("mpnsearch", { mpn, host: host || "", skip: skip || [] }); return j.failed ? { candidates: [], message: j.message } : j; }
  async function priceSearch(q, sites, scope, skip){ return call("pricesearch", { q, sites, scope, skip: skip || [] }); }
  async function batch(writes){ for (let i = 0; i < writes.length; i += 200) await call("batch", { writes: writes.slice(i, i + 200) }); refreshSoon(); }
  async function logout(){ try { await call("logout"); } catch(e) {} location.reload(); }
  const blobUrl = id => "blob.php?id=" + encodeURIComponent(id);
  async function blobBytes(id){ const r = await fetch(blobUrl(id), { credentials: "same-origin" }); if (!r.ok) return null; const b = await r.blob(); return { type: b.type, data: await b64(b) }; }
  async function priceHistory(itemId){ const j = await call("prices", { itemId }); return j.docs.map(d => ({ id: d.id, ...d.data })); }
  return { db, call, use, readLink, findProduct, fetchPhoto, fetchLogo, readDoc, priceSearch, priceHistory, usage, mpnSearch, batch, logout, blobUrl, blobBytes, b64, ai: () => !!(status && status.ai) };
})();
window.claude = { use: name => window.TDC.use(name) };
</script>

  m = v.match(/^(\d{1,2})[\/.\-](\d{2}|\d{4})$/);
  if (m) { let y = +m[2]; if (y < 100) y += 2000; return new Date(y, +m[1], 0); }
  m = v.match(/^(\d{4})-(\d{1,2})(?:-(\d{1,2}))?$/);

async function markOrdered(list){
  if (!list.length || !needMe()) return;

  let oid = ""; try { const ref = await db.collection("orders").add({ at: Date.now(), initials: me(), lines }); oid = ref?.id || ""; } catch {}
  let ok = 0;

    const p = ordPrice(it);
    try { await write(it.id, { ordered: today(), orderedQty: it.orderQty, orderReq: 0, orderAmt: 0, orderedPrice: p ?? null, orderPrice: null, orderId: oid }); logIt("Ordered", it, `${fmtQ(it.orderQty)}${it.units ? " × " + it.units : ""}${it.supplier ? " from " + it.supplier : ""}`); ok++; }

  if (!oid && ok) { try { await db.collection("orders").add({ at: Date.now(), initials: me(), lines: lines.slice(0, ok) }); } catch {} }

function parseCsv(text){
  const rows = []; let row = [], cell = "", q = false;

    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += ch; continue; }
    if (ch === '"' && cell === "") q = true;   /* a quote only opens a quoted cell at its very start; 2" gauze stays text */
    else if (ch === ",") { row.push(cell); cell = ""; }
    else if (ch === "\n" || ch === "\r") { if (ch === "\r" && text[i + 1] === "\n") i++; row.push(cell); rows.push(row); row = []; cell = ""; }

}

        const otherSup = sup && it.supplier && keyOf(canonSup(sup) || sup) !== keyOf(it.supplier);   /* another supplier's price list: keep it as that supplier's price only */
        if (price && num(it.unitCost) !== pr && !otherSup) { patch.unitCost = price; said.push(`price ${it.unitCost || "–"} → ${price}`); }
        if (l.sku && !clean(it.sku) && !otherSup) { patch.sku = l.sku; said.push("SKU " + l.sku); }
        if (mode === "receive" && q > 0) { Object.assign(patch, { qty: (it.qty ?? 0) + q, ordered: "", orderedQty: 0, orderAmt: 0, lastReceived: today() }); }

        if (mode === "receive" && q > 0 && priceNum(price) != null) { try { await setOrderLinePrice(it, priceNum(price)); } catch {} }
        if (said.length) logIt("Edited", it, `${said.join(", ")} (from ${src})`);
        ok++;
      } else {
        const name = clean(l.name) || clean(l.desc); if (!name) continue;
        const doc = { name, sku: l.sku || "", supplier: sup, units: l.pack || "", unitCost: price, link: "", desc: "", cat: "", sub: "", loc: "", notes: "", exp: "", photo: "", skuPhoto: "",
          qty: mode === "receive" && q > 0 ? q : 0, desired: null, urgent: null,
          ordered: mode === "ordered" && q > 0 ? ordDate : "", orderedQty: mode === "ordered" && q > 0 ? q : 0,
          lastReceived: mode === "receive" && q > 0 ? today() : "", createdAt: Date.now(), updatedAt: Date.now(), updatedBy: me() };
        const ref = await addItemDoc(doc);
        logIt("Added", { id: ref.id, name }, `From ${src}${sup ? " · " + sup : ""}`);
        if (doc.ordered) orderLines.push({ id: ref.id, name, qty: q, units: doc.units, supplier: sup, ...(priceNum(price) != null ? { price: priceNum(price) } : {}) });
        ok++; added++;

    }
    if (ok) await docRemember(r, mode, ok);
    if (orderLines.length) { try { await db.collection("orders").add({ at: Date.now(), initials: me(), lines: orderLines }); } catch {} }
    sync("ok", "Saved");
    if (recv) Sfx.play("receive"); else if (ordd) Sfx.play("order");
    closePanel(); render();
    toast(ok ? [recv ? `${recv} received` : "", ordd ? `${ordd} marked ordered` : "", added ? `${added} new product${added !== 1 ? "s" : ""} added` : "", !recv && !ordd && ok - added ? `${ok - added} updated` : ""].filter(Boolean).join(", ") || `${ok} updated` : "Nothing needed changing");
  } catch(e) {
    sync("err", "Not all saved"); toast(dbErr(e) + (ok ? ` (${ok} saved before that)` : "")); btn.disabled = false; btn.textContent = "Apply";

}

async function scanFile(file){
  const url = URL.createObjectURL(file);
  openPanel(`<div class="ph"><h2>Reading the label…</h2><button class="iconbtn" data-close type="button">Close</button></div>
    <div class="shot"><img id="shotImg" src="${url}" alt="Your photo"><div class="status" id="scanStatus">Looking for a barcode…</div></div><div id="scanOut"></div>`);
  const img = $("#shotImg"); await img.decode().catch(()=>{});
  const status = t => { const s = $("#scanStatus"); if (s) s.textContent = t; };
  const code = await decodeBarcode(img);
  if (code && hashItemId(code)) { const lh = byId(hashItemId(code)); if (lh) { if (!$("#scanOut")) return; openItem(lh, { note: "Shelf label scanned. Update the count and save." }); return; } }
  if (code) {
    const hit = items.find(i => (i.sku && normSku(i.sku) === normSku(code)) || (i.barcode && String(i.barcode) === String(code)));
    if (hit) { if (!$("#scanOut")) return; openItem(hit, { note: `Barcode ${code} matched this item. Update the count and save.` }); return; }
  }
  if (!sample || !canImages) {
    status(code ? `Barcode ${code} isn't on the list yet.` : "No barcode found, and label reading isn't available here.");
    if (!$("#scanOut")) return;
    $("#scanOut").innerHTML = `<div class="actions"><button class="btn pri grow" id="toNew" type="button">Add it as a new product</button></div>`;
    $("#toNew").onclick = () => openNew({ sku: code || "", photoFile: file });
    return;
  }
  status(code ? `Barcode ${code}. Reading the label…` : "Reading the label…");
  const catalog = items.map(i => `${i.id}|${i.name}${i.sku ? "|" + i.sku : ""}`).join("\n");
  const prompt = `This is a phone photo of a dental supply product in a dental office supply room. Read the packaging and identify the product.
${code ? "A barcode on it decoded as: " + code + "\n" : ""}
Reply with only one JSON object:
{"name": "clear, short inventory name: brand + product + shade/size (no pack count; keep any tooth shade)", "brand": "", "catalogNumber": "manufacturer catalog/REF/SKU number printed on the box, or empty", "barcode": "UPC/GTIN digits if readable, or empty", "units": "packaging unit such as Box, Case, Tube, Syringe, Pack of 100", "category": "best fit from: ${uniq("cat").slice(0,40).join(", ")}", "expiration": "M/D/YYYY if an expiry date is printed, else empty", "matchId": "id of the existing item below that is the SAME product, or null", "matchReason": "short reason"}

matchId: the id from the list below that is the SAME product (same variant/shade/size), or null if none is. Be strict: a different shade or size is not a match.
Existing inventory (id|name|sku):
${catalog}`;
  try {
    const r = await sample.json(prompt, { images: [file] });
    const sku = clean(r?.catalogNumber) || clean(r?.barcode) || code || "";
    const hit = r?.matchId ? byId(String(r.matchId)) : null;
    if (hit) {
      status(`Read as: ${clean(r.name)}`);
      if (!$("#scanOut")) return;
      $("#scanOut").innerHTML = `<div class="match"><span class="hint">This looks like a product already on the list:</span><span class="nm">${esc(hit.name)}</span><span class="hint">${esc(r.matchReason || "")} · On hand ${fmtQ(hit.qty)} / desired ${fmtQ(hit.desired)}</span>
        <div class="actions"><button class="btn pri grow" id="useHit" type="button">Update this product</button><button class="btn" id="notHit" type="button">Different product</button></div></div>`;
      if (assets && !hit.photo) $("#useHit").insertAdjacentHTML("beforebegin", `<label class="hint" style="display:flex;gap:6px;align-items:center;flex-basis:100%"><input type="checkbox" id="keepPic" checked> Save this photo as the product photo</label>`);
      $("#useHit").onclick = () => {
        const bc = code || clean(r.barcode); if (bc && hit.barcode !== bc && !(hit.sku && normSku(hit.sku) === normSku(bc))) write(hit.id, { barcode: bc }).catch(() => {});   /* remember the barcode so the next scan is instant and free */
        const pre = {
        sku: hit.sku || sku, exp: clean(r.expiration) || hit.exp,
        note: (!hit.sku && sku ? `SKU ${sku} from the label is filled in, so next time a scan finds it instantly. ` : "") + (r.expiration ? `Label expiry ${r.expiration} filled in. ` : "") + "Update the count, then save."
      };
        if ($("#keepPic")?.checked) setItemPhoto(hit, file, pre); else openItem(hit, pre);
      };
      $("#notHit").onclick = () => openNew(newFrom(r, sku, file));
    } else {
      /* scanning is for counting: a product that isn't on the list is offered, not added automatically */
      status(`Read as: ${clean(r.name) || "an unknown product"}. It isn't on your list.`);
      if (!$("#scanOut")) return;
      $("#scanOut").innerHTML = `<div class="actions"><button class="btn grow" id="again" type="button">Try another photo</button><button class="btn pri grow" id="toNew" type="button">Add it as a new product</button></div>`;
      $("#again").onclick = startScan; $("#toNew").onclick = () => openNew(newFrom(r, sku, file));
    }
  } catch(e) {
    const msg = { not_granted:"Label reading needs your OK to use Claude. Scan again and choose Allow.", rate_limited:"Too many scans at once. Wait a moment and try again.", image_rejected:"That photo couldn't be read. Try another photo with the label in focus.", invalid_json:"The label couldn't be made out. Try a closer, sharper photo.", refused:"This photo couldn't be read. Try a photo of just the label." }[e?.code] || "Label reading didn't work this time. Try again or add the product by hand.";
    status(msg); $("#scanStatus")?.classList.add("err");
    if (!$("#scanOut")) return;
    $("#scanOut").innerHTML = `<div class="actions"><button class="btn grow" id="again" type="button">Try another photo</button><button class="btn pri grow" id="manual" type="button">Add by hand</button></div>`;
    $("#again").onclick = startScan; $("#manual").onclick = () => openNew({ sku: code || "", photoFile: file });
  }
}

function groupsOf(field){
  const m = new Map();
  items.forEach(i => { const v = clean(i[field]); if (!v) return; const k = keyOf(v); if (!m.has(k)) m.set(k, { name: v, n: 0, reps: new Map() }); const g = m.get(k); g.n++; if (i.rep) g.reps.set(i.rep, (g.reps.get(i.rep) || 0) + 1); });
  if (field === "loc") locExtra.forEach(v => { v = clean(v); if (v && !m.has(keyOf(v))) m.set(keyOf(v), { name: v, n: 0, reps: new Map() }); });
  return [...m.values()].sort((a,b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
}
function orderedSuppliers(){
  const n = new Map(items.map(i => [keyOf(i.supplier), 0])); items.forEach(i => n.set(keyOf(i.supplier), n.get(keyOf(i.supplier)) + 1));
  const gs = groupsOf("supplier");
  supExtra.forEach(nm => { if (!gs.some(g => keyOf(g.name) === keyOf(nm))) gs.push({ name: nm, n: 0, reps: new Map() }); });
  return gs.sort((a,b) => (supRank(a.name) - supRank(b.name)) || (b.n - a.n) || a.name.localeCompare(b.name, undefined, { numeric: true }));
}

/* drag-to-reorder for a Setup list: rows are .setrow, each with a grip button carrying gripAttr */
function wireSortable(list, gripAttr, keyOfRow, commit, moveBy){
  if (!list) return;
  list.addEventListener("pointerdown", e => {
    const g = e.target.closest(`[${gripAttr}]`); if (!g || e.button > 0) return;
    if (!needMe()) return;
    e.preventDefault();
    const row = g.closest(".setrow");
    dragging = true; row.classList.add("dragging"); document.body.classList.add("is-dragging");
    try { g.setPointerCapture(e.pointerId); } catch {}
    let raf = 0, lastY = e.clientY;
    const scroll = () => { const m = 80; if (lastY < m) window.scrollBy(0, -10); else if (lastY > innerHeight - m - 70) window.scrollBy(0, 10); raf = dragging ? requestAnimationFrame(scroll) : 0; };
    raf = requestAnimationFrame(scroll);
    const move = ev => {
      lastY = ev.clientY;
      let before = null;
      for (const r of list.querySelectorAll(".setrow")) { if (r === row) continue; const b = r.getBoundingClientRect(); if (ev.clientY < b.top + b.height / 2) { before = r; break; } }
      if (before !== row.nextElementSibling || (!before && list.lastElementChild !== row)) list.insertBefore(row, before);
      list.querySelectorAll(".setrow").forEach((r, i) => { const n = r.querySelector(".rank"); if (n) n.textContent = i + 1; });
    };
    const end = () => {
      window.removeEventListener("pointermove", move); window.removeEventListener("pointerup", end); window.removeEventListener("pointercancel", end);
      cancelAnimationFrame(raf); dragging = false; row.classList.remove("dragging"); document.body.classList.remove("is-dragging");
      commit([...list.querySelectorAll(".setrow")].map(keyOfRow));
    };
    /* listen on the window: moving the row in the page drops the grip's pointer capture, so its own pointerup may never arrive */
    window.addEventListener("pointermove", move); window.addEventListener("pointerup", end); window.addEventListener("pointercancel", end);
  });
  list.addEventListener("keydown", e => {
    const g = e.target.closest(`[${gripAttr}]`); if (!g) return;
    if (e.key === "ArrowUp" || e.key === "ArrowDown") { e.preventDefault(); moveBy(g.getAttribute(gripAttr), e.key === "ArrowUp" ? -1 : 1); }
  });
}

/* ---------- hosted: full backup and restore ---------- */
const BACKUP_COLS = ["items", "log", "orders", "reps", "counts", "supinfo", "settings", "prices"];
async function fullBackup(btn){
  const label = btn.textContent; btn.disabled = true;
  try {
    const collections = {};
    for (const c of BACKUP_COLS) { btn.textContent = "Saving " + c + "…"; const docs = await allDocs(c); collections[c] = Object.fromEntries(docs.map(d => [d.id, d.data()])); }
    const ids = [...new Set(Object.values(collections.items).flatMap(i => [i.photo, i.skuPhoto]).filter(x => /^[a-f0-9]{32}$/.test(x || "")))];
    const blobs = {}; let missed = 0;
    for (let k = 0; k < ids.length; k++) { btn.textContent = `Photos ${k + 1}/${ids.length}…`; try { const bl = await photoBlob(ids[k]); if (bl) blobs[ids[k]] = { type: bl.type, data: await docB64(bl) }; else missed++; } catch { missed++; } }
    const stamp = new Date().toISOString().slice(0, 10);
    await downloads.save({ filename: `TDC supply room ${stamp}.backup.json`, data: JSON.stringify({ app: "tdc-supply-room", version: 1, exportedAt: Date.now(), collections, blobs }) });
    const cnt = c => Object.keys(collections[c] || {}).length;
    toast(`Backup saved: ${cnt("items")} products, ${cnt("log")} activity entries, ${cnt("orders")} orders, ${Object.keys(blobs).length} photos${missed ? `. ⚠ ${missed} photo${missed === 1 ? "" : "s"} couldn't be read and ${missed === 1 ? "is" : "are"} missing from the file` : ""}`);
  } catch(e) { toast("Backup failed: " + (e?.message || e)); }
  finally { btn.disabled = false; btn.textContent = label; }
}

  openPanel(`<div class="ph"><h2>Restore backup</h2><button class="iconbtn" data-close type="button">Close</button></div>
    <p>${n.items} products, ${n.reps} reps, ${n.supinfo} supplier accounts, ${n.settings} settings, ${n.log} activity entries, ${n.orders} orders, ${n.prices} price checks and ${nb} photos.</p>
    <p class="hint">Anything with the same id here is replaced by the copy in the file. Nothing is deleted.</p>
    <div class="bprog" hidden><span style="width:0%"></span></div><p class="hint" id="rsStat"></p>
    <div class="actions"><button class="btn pri" id="rsGo" type="button">Restore</button><button class="btn" data-close type="button">Cancel</button></div>`);
  $("#rsGo").onclick = async () => {
    const go = $("#rsGo"), bar = $("#overlay .bprog"), fill = bar.firstElementChild, stat = $("#rsStat"); go.disabled = true; bar.hidden = false;
    const writes = BACKUP_COLS.flatMap(c => Object.entries(j.collections[c] || {}).map(([id, data]) => ({ op: "set", col: c, id, data })));
    const blobs = Object.entries(j.blobs || {}), total = writes.length + blobs.length; let done = 0;
    const tick = t => { fill.style.width = Math.round(100 * done / Math.max(1, total)) + "%"; stat.textContent = t; };
    try {
      for (let i = 0; i < writes.length; i += 200) { await TDC.call("batch", { writes: writes.slice(i, i + 200) }); done += Math.min(200, writes.length - i); tick(`Saved ${done} of ${writes.length} records…`); }
      for (const [id, b] of blobs) { try { await TDC.call("blob_put", { id, type: b.type, data: b.data }); } catch {} done++; tick(`Photos: ${done - writes.length} of ${blobs.length}…`); }
      tick("Done."); toast("Backup restored"); setTimeout(() => location.reload(), 900);
    } catch(e) { stat.textContent = "Stopped: " + (e?.message || e) + " Run it again to finish; it's safe to repeat."; go.disabled = false; }
  };
}

/* every document in a collection: the server's "dump" on Hostinger (normal reads stop at 2,000), a plain read otherwise */
async function allDocs(col){
  if (window.HOSTED) return (await TDC.call("dump", { col })).docs.map(d => ({ id: d.id, data: () => d.data }));
  return (await db.collection(col).get()).docs;
}
async function photoBlob(id){
  if (!id) return null;
  const r = await fetch(window.HOSTED ? "blob.php?id=" + encodeURIComponent(id) : "/_blob/" + encodeURIComponent(id), { credentials: "same-origin" });
  return r.ok ? await r.blob() : null;
}
async function bulkWrite(col, writes, tick){   /* writes: [{ id, data } to merge, or { id, del: true }] */
  if (window.HOSTED) {
    for (let i = 0; i < writes.length; i += 200) { await TDC.call("batch", { writes: writes.slice(i, i + 200).map(w => w.del ? { op: "delete", col, id: w.id } : { op: "update", col, id: w.id, data: w.data }) }); tick?.(Math.min(i + 200, writes.length)); }
  } else {
    let k = 0; for (const w of writes) { if (w.del) await db.doc(col + "/" + w.id).delete(); else await db.doc(col + "/" + w.id).update(w.data); if (++k % 10 === 0) tick?.(k); }
  }
}

    $("#coSave") && ($("#coSave").onclick = async () => { const rows = old.map(d => d.data()).sort((a, b) => a.at - b.at); await downloads.save({ filename: `TDC supply activity before ${new Date(cut).toLocaleDateString("en-CA")}.csv`, data: "Date,Time,Initials,Action,Product,Detail\n" + rows.map(e => { const d = new Date(e.at); return [d.toLocaleDateString(), d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }), e.initials, e.action, e.name, e.detail].map(csvCell).join(","); }).join("\n") }); toast("Saved"); });
    $("#coGo").onclick = async () => {

/* ---------- boot ---------- */
async function boot(){
  db = await window.claude?.use?.("db");
  if (!db) {
    sync("err", "Offline");
    $("#view").innerHTML = `<div class="notice"><b>Can't reach the Supply Room server</b><span class="hint">Reload the page. If it keeps happening, check config.php on the server.</span></div>`;
    return;
  }
  user = await claude.use("user");
  if (user) { myId = await user.id(); canWrite = await user.can("data.write"); if (canWrite === false) readOnly = true; }
  let first = true;
  db.collection("items").onSnapshot(snap => {
    const all = snap.docs.map(d => derive({ id: d.id, ...d.data() })).filter(i => i.name);
    archived = all.filter(i => i.archived); items = all.filter(i => !i.archived);
    fillFilters();
    if (!$("#overlay").innerHTML || first) render();
    else render();
    if (first && hashSection()) openSection(hashSection());
    if (first) openHashItem();
    first = false;
    sync(readOnly ? "" : "ok", readOnly ? "View only" : "Live");
  }, e => { sync("err", "Disconnected"); $("#view").innerHTML = `<div class="notice err"><b>Lost the connection to the supply list</b><span>${esc(dbErr(e))} Reload the page to reconnect.</span></div>`; });
  db.collection("orders").orderBy("at", "desc").limit(30).onSnapshot(snap => {
    orders = snap.docs.map(d => d.data()); spendOrders = null;
    if (tab === "ordered") render();
  }, () => {});
  db.doc("settings/docsSeen").onSnapshot(snap => { docsSeen = (snap.exists && snap.data().list) || []; }, () => {});
  db.doc("settings/team").onSnapshot(snap => {
    team = (snap.exists && snap.data().initials) || [];
    renderWho(); render();
  }, () => {});
  db.doc("settings/suppliers").onSnapshot(snap => {
    const d = (snap.exists && snap.data()) || {};
    supOrder = d.order || []; supReps = d.reps || {}; supExtra = d.extra || [];
    render();
  }, () => {});
  db.doc("settings/locs").onSnapshot(snap => {
    locExtra = ((snap.exists && snap.data().extra) || []).filter(x => typeof x === "string" && x.trim());
    locOrder = ((snap.exists && snap.data().order) || []).filter(x => typeof x === "string");
    render();
  }, () => {});
  db.doc("settings/cats").onSnapshot(snap => {
    catExtra = ((snap.exists && snap.data().extra) || []).filter(x => x && x.c);
    fillFilters(); render();
  }, () => {});
  db.collection("supinfo").onSnapshot(snap => {
    supInfo = Object.fromEntries(snap.docs.map(d => [d.id, d.data()]));
    render();
  }, () => {});
  db.collection("reps").onSnapshot(snap => {
    reps = snap.docs.map(d => ({ id: d.id, name: "", company: "", cell: "", phone: "", email: "", account: "", website: "", notes: "", ...d.data() })).sort((a,b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
    render();
  }, () => {});
  db.doc("settings/colors").onSnapshot(snap => {
    const d = (snap.exists && snap.data()) || {};
    colSaved = Object.fromEntries(Object.entries(d).filter(([k, v]) => k in COL_DEFAULT && /^#[0-9a-f]{6}$/i.test(v)));
    if (Object.keys(colSaved).every(k => colSaved[k].toLowerCase() === COL_DEFAULT[k])) colSaved = {};
    applyStockColors(); if (tab === "setup") render();
  }, () => {});
  db.doc("settings/rules").onSnapshot(snap => {
    rules = { expDays: 60, ...((snap.exists && snap.data()) || {}) };
    { const d = num(rules.expDays); rules.expDays = d == null ? 60 : Math.max(0, Math.min(365, Math.round(d))); }
    items.forEach(derive); render();
  }, () => {});
  subLog();
  downloads = await claude.use("downloads"); $("#exportBtn").hidden = true; /* export lives in Setup › Backup (and the Editor); this hidden button just runs it */
  assets = await claude.use("assets");
  sample = await claude.use("sample");
  mcp = await claude.use("mcp");
  if (sample) { const lim = await sample.limits().catch(() => null); canImages = !!lim?.images; }
}

<script>
(function(){
